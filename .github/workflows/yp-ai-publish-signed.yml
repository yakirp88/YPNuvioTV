name: YP AI publish privately signed APK

on:
  push:
    branches: [yp/ai-intro]
    paths: [config/yp-signed-release.json]
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: yp-ai-publish-signed
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install APK verification tools
        run: sdkmanager 'build-tools;36.0.0'
      - name: Verify signer, package, version and checksum before publication
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 tools/yp/publish-signed.py

name: YP IntroDB build
on:
  workflow_dispatch:
    inputs:
      publish_release:
        description: Publish the APKs as a GitHub prerelease
        type: boolean
        default: true
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Apply the reviewed source patch on first run
        run: |
          if [ ! -f app/src/main/java/com/nuvio/tv/data/introdb/IntroDbReportRules.kt ]; then
            git apply --index --exclude='.github/workflows/*' YP-Nuvio-IntroDB.patch
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'Apply native IntroDB reporting and addon setup'
            git push origin HEAD:dev
          fi
          echo "SOURCE_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - uses: gradle/actions/setup-gradle@v4
      - name: Configure public services
        run: |
          printf '%s\n' "sdk.dir=$ANDROID_HOME" 'INTRODB_API_URL=https://api.introdb.app/' 'DOVI_NATIVE_ENABLED=false' > local.properties
          chmod +x gradlew
      - name: Reporting policy tests and APKs
        run: >
          ./gradlew -Pkotlin.compiler.execution.strategy=in-process
          "-Dorg.gradle.jvmargs=-Xmx5120m -XX:MaxMetaspaceSize=768m -Dfile.encoding=UTF-8"
          :app:testFullDebugUnitTest --tests "com.nuvio.tv.data.introdb.*"
          :app:assembleFullDebug --no-daemon --max-workers=1
      - uses: actions/upload-artifact@v4
        with:
          name: YP-Nuvio-IntroDB-debug-apks
          path: app/build/outputs/apk/full/debug/*.apk
          if-no-files-found: error
      - name: Publish APK download links
        if: ${{ inputs.publish_release }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "yp-introdb-${GITHUB_RUN_NUMBER}"
          app/build/outputs/apk/full/debug/*.apk
          --target "$SOURCE_SHA" --prerelease
          --title "YP Nuvio IntroDB test build ${GITHUB_RUN_NUMBER}"
          --notes-file YP-INTRODB-RELEASE-NOTES.md

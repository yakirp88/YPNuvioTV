name: YP AI build and versioned release

on:
  push:
    branches: [yp/ai-intro]
    paths-ignore: ['**/*.md', 'config/yp-signed-release.json', 'tools/gemini-communication/**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: yp-ai-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
    env:
      SIGNING_KEY: ${{ secrets.YP_DEBUG_KEYSTORE_BASE64 }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false
      - name: Configure version and public client
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
          cp config/yp-public-client.properties local.dev.properties
          python3 tools/yp/version.py >> "$GITHUB_ENV"
          chmod +x gradlew
      - name: Restore persistent signing key
        if: env.SIGNING_KEY != ''
        shell: bash
        run: |
          set -euo pipefail
          install -d -m 700 "$HOME/.android"
          printf '%s' "$SIGNING_KEY" | base64 --decode > "$HOME/.android/debug.keystore"
          chmod 600 "$HOME/.android/debug.keystore"
          keytool -exportcert -keystore "$HOME/.android/debug.keystore" \
            -alias androiddebugkey -storepass android -file "$RUNNER_TEMP/yp.der"
          expected=$(tr -d '\r\n' < config/yp-signing-sha256.txt)
          actual=$(sha256sum "$RUNNER_TEMP/yp.der" | cut -d ' ' -f 1)
          test "$actual" = "$expected"
      - name: Validate analyzer and review rules
        run: |
          python3 tools/intro-evidence-check/check_android_regex.py
          mkdir -p "$RUNNER_TEMP/yp-core-check"
          javac -d "$RUNNER_TEMP/yp-core-check" \
            app/src/main/java/com/nuvio/tv/core/intro/{SubtitleEvidenceAnalyzer,IntroSubmissionMode,AiSegmentProposal,IntroDetectionPhase,VideoSamplingPlan,SegmentReviewRange}.java \
            tools/intro-evidence-check/SubtitleEvidenceCheck.java
          java -cp "$RUNNER_TEMP/yp-core-check" SubtitleEvidenceCheck
      - name: Test and build universal APK
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew -PypUniversalOnly=true -Pksp.incremental=false -Pkotlin.incremental=false \
            -Pkotlin.compiler.execution.strategy=in-process \
            '-Dorg.gradle.jvmargs=-Xmx5120m -XX:MaxMetaspaceSize=768m -Dfile.encoding=UTF-8' \
            :app:testFullDebugUnitTest --tests 'com.nuvio.tv.ui.screens.player.SkipIntroVisibilityRulesTest' \
            --tests 'com.nuvio.tv.ui.screens.player.IntroDetectionFailureBoundaryTest' \
            --tests 'com.nuvio.tv.core.diagnostics.YpCrashReportTextTest' \
            --tests 'com.nuvio.tv.core.intro.GeminiHttpTransportTest' \
            --tests 'com.nuvio.tv.core.intro.IntroAcquisitionTest' \
            --tests 'com.nuvio.tv.ui.screens.player.autosync.EmbeddedSubtitleTimelineLoaderTest' \
            :app:assembleFullDebug --configure-on-demand --max-workers=1 --no-daemon
      - name: Prepare distribution
        if: env.SIGNING_KEY != ''
        run: |
          set -euo pipefail
          mkdir -p distribution
          cp app/build/outputs/apk/full/debug/app-full-debug.apk distribution/Nuvio-YP.apk
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose distribution/Nuvio-YP.apk
          (cd distribution && sha256sum Nuvio-YP.apk > SHA256SUMS.txt)
          git archive --format=zip --prefix=Nuvio-YP/ HEAD > distribution/source.zip
      - name: Publish unique prerelease
        if: env.SIGNING_KEY != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="yp-ai-build-${GITHUB_RUN_NUMBER}"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo 'This immutable build was already published; no replacement performed.'
            exit 0
          fi
          gh release create "$tag" distribution/* --target "$GITHUB_SHA" --prerelease \
            --title "YP AI ${YP_VERSION_NAME}" --notes-file CHANGELOG.md
      - name: Retain input for private local signing
        if: env.SIGNING_KEY == ''
        uses: actions/upload-artifact@v4
        with:
          name: yp-ai-signing-input-${{ github.run_number }}
          path: app/build/outputs/apk/full/debug/app-full-debug.apk
          retention-days: 3
          if-no-files-found: error
      - name: Report missing persistent signer
        if: env.SIGNING_KEY == ''
        run: |
          echo '::warning::Build checked. Use the signing-input artifact for private local signing, or configure YP_DEBUG_KEYSTORE_BASE64 for direct CI publication.'
          echo 'No APK distributed with a disposable signing key.' >> "$GITHUB_STEP_SUMMARY"
      - name: Remove signing material
        if: always() && env.SIGNING_KEY != ''
        run: rm -f "$HOME/.android/debug.keystore" "$RUNNER_TEMP/yp.der"

name: Gemini standalone diagnostics
on:
  push:
    branches: [yp/ai-intro]
    paths: ['tools/gemini-communication/**', '.github/workflows/yp-gemini-diagnostics.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Verify standalone Python and browser protocol logic without credentials
        run: |
          python3 -m unittest discover -s tools/gemini-communication -p 'test_*.py' -v
          node tools/gemini-communication/test-browser.cjs
      - name: Package source-only local diagnostic tool
        run: python3 tools/gemini-communication/package.py "$RUNNER_TEMP/Gemini-Communication-Check-v1.0.0.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: Gemini-Communication-Check-v1.0.0
          path: ${{ runner.temp }}/Gemini-Communication-Check-v1.0.0.zip
          if-no-files-found: error
          retention-days: 7

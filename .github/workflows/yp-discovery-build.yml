name: YP Content Discovery test build
on:
  push:
    branches: [feature/content-discovery]
    paths:
      - '.github/workflows/yp-discovery-build.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: ypnuvio-discovery-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - uses: gradle/actions/setup-gradle@v4
      - name: Configure services
        run: |
          printf '%s\n' "sdk.dir=$ANDROID_HOME" 'INTRODB_API_URL=https://api.introdb.app/' 'DOVI_NATIVE_ENABLED=false' > local.properties
          chmod +x gradlew
      # Validate the native TMDB key dialog and shared credential compatibility.
      - name: Build and test
        env:
          CI_USE_DEBUG_SIGNING: true
        run: >
          ./gradlew -Pkotlin.compiler.execution.strategy=in-process
          -Pkotlin.incremental=false -Pdebuggable=false
          "-Dorg.gradle.jvmargs=-Xmx5120m -XX:MaxMetaspaceSize=768m -Dfile.encoding=UTF-8"
          :app:testFullDebugUnitTest
          --tests "com.nuvio.tv.ui.screens.discovery.DiscoveryPolicyTest"
          --tests "com.nuvio.tv.core.tmdb.TmdbCollectionSourceResolverTest"
          --tests "com.nuvio.tv.core.tmdb.TmdbMetadataServiceTest"
          --tests "com.nuvio.tv.data.introdb.*"
          --tests "com.nuvio.tv.data.local.DiscoveryPreferencesTest"
          --tests "com.nuvio.tv.data.local.CollectionsDataStoreSourceMigrationTest"
          :app:assembleFullRelease --no-daemon --max-workers=1
      - name: Name universal APK
        run: cp app/build/outputs/apk/full/release/app-full-universal-release.apk Nuvio-content-discovery.apk
      - uses: actions/upload-artifact@v4
        with:
          name: YP-Nuvio-Content-Discovery
          path: Nuvio-content-discovery.apk
          if-no-files-found: error
      - name: Publish download
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "yp-discovery-${GITHUB_RUN_NUMBER}"
          Nuvio-content-discovery.apk
          --target "$GITHUB_SHA" --prerelease
          --title "YP Nuvio Content Discovery test build ${GITHUB_RUN_NUMBER}"
          --notes-file YP-DISCOVERY-RELEASE-NOTES.md

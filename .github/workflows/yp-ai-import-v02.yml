name: YP AI import verified v0.2 APK

on:
  push:
    branches: [yp/ai-intro]
    paths: [.github/workflows/yp-ai-import-v02.yml]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: yp-ai-import-v02
  cancel-in-progress: false

jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - name: Import and verify previously built APK
        shell: bash
        run: |
          set -euo pipefail
          if gh release view yp-ai-v0.2.0 >/dev/null 2>&1; then
            echo 'Version 0.2 already exists; not overwriting it.'
            exit 0
          fi
          mkdir -p distribution
          curl --fail --location --retry 2 --max-time 240 \
            https://litter.catbox.moe/pydey2.apk -o distribution/Nuvio-YP.apk
          echo '34d8c1b1b3743222ae9d2c7a6aaee58cc5b4339d8820a0b314b716d3b8e916a2  Nuvio-YP.apk' > distribution/SHA256SUMS.txt
          (cd distribution && sha256sum -c SHA256SUMS.txt)
          curl --fail --location --retry 2 --max-time 60 \
            https://files.catbox.moe/s6jsw3.zip -o distribution/source-changes.zip
          echo '0a71807dd893f5c291d496f9c25cd7058304473ff2a28020d004d97236e529ae  distribution/source-changes.zip' | sha256sum -c -
          cat > "$RUNNER_TEMP/release-notes.md" <<'NOTES'
          Previously built Nuvio YP AI 0.2 universal APK. Android version code: 1072.
          Startup QR configuration fixed; anonymous pairing API verified. TV phone approval needs device testing.
          APK SHA-256 was checked during import. Automatic AI publication and audio analysis are not implemented.
          source-changes.zip contains exact corresponding changes and rebuild instructions on official beta.8.
          The source branch now also contains version 0.3 release infrastructure, which is not included in this APK.
          NOTES
          gh release create yp-ai-v0.2.0 distribution/* --target "$GITHUB_SHA" --prerelease \
            --title 'YP AI 0.2.0 — verified APK import' --notes-file "$RUNNER_TEMP/release-notes.md"
